name: Datum Zero Automated Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build-geospatial-layers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Osmium & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool curl
          pip install requests

      - name: Download & Extract Wales OSM Dump (With Mirror Failover)
        run: |
          curl -4 -sSL --connect-timeout 15 --fail https://download.openstreetmap.fr/extracts/europe/united_kingdom/wales-latest.osm.pbf -o wales-latest.osm.pbf || \
          curl -4 -sSL --connect-timeout 15 --fail https://download.geofabrik.de/europe/great-britain/wales-latest.osm.pbf -o wales-latest.osm.pbf || \
          echo "PBF mirrors blocked on runner ASN; falling back to multi-mirror Overpass extraction."

          if [ -s wales-latest.osm.pbf ]; then
            osmium tags-filter wales-latest.osm.pbf n/natural=spring n/emergency=defibrillator -o wales_filtered.osm.pbf --overwrite
            osmium export wales_filtered.osm.pbf -o raw_wales_assets.geojson -f geojson --add-unique-id=type_id --overwrite
          fi

      - name: Run Wales Resilience Extractor
        run: python pipelines/build_wales_resilience_layer.py

      - name: Commit updated GeoJSON to repository
        run: |
          git config user.name "DatumZero-Bot"
          git config user.email "bot@datumzero.local"
          git add dist/wales_resilience_master.geojson
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(etl): update Wales resilience GeoJSON"
          git push
